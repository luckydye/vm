# Desktop of the guest user. Seed your own ~/.config/hypr/hyprland.conf to replace it.
monitor = , preferred, auto, 1

exec-once = /usr/local/libexec/varmint-clipboard-agent
exec-once = /usr/local/libexec/varmint-display-fit

# `vm ui` draws the pointer on the host from the shape Hyprland reports, so
# the guest does not draw its own cursor into the screen. Hyprland still
# reports the shape while the cursor is invisible.
cursor {
    invisible = true
}

general {
    border_size = 0
    gaps_in = 1
    gaps_out = 0
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# The VM window does not pass Cmd to the guest, so Option (Alt) is the modifier.
$mod = ALT

# The host's light or dark appearance, written by varmint-appearance.
source = ~/.config/hypr/varmint-appearance.conf

bind = $mod, Return, exec, foot
bind = $mod, Space, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
