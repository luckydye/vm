name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache guest runtime
        uses: actions/cache@v4
        with:
          path: build/guest
          key: guest-${{ matrix.arch }}-${{ hashFiles('guest/**', 'patches/hyprland/**') }}

      - name: Build guest runtime
        run: make guest-image

      - name: Upload guest runtime
        uses: actions/upload-artifact@v4
        with:
          name: guest-runtime-${{ matrix.arch }}
          path: build/guest
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  app:
    needs: guest
    runs-on: macos-26

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install meson pkg-config
          brew tap nirs/vmnet-helper
          brew trust nirs/vmnet-helper
          brew install vmnet-helper

      - name: Install Metal toolchain
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: Cache host dependencies
        uses: actions/cache@v4
        with:
          path: build/prefix
          key: host-deps-macos26-arm64-${{ hashFiles(
            'runtime/manifest.toml',
            'scripts/build.sh',
            'scripts/build-common.sh',
            'scripts/build-dependencies.sh',
            'patches/**'
            ) }}

      - name: Build host dependencies
        run: make dependencies

      - name: Download guest runtime
        uses: actions/download-artifact@v4
        with:
          name: guest-runtime-arm64
          path: build/guest

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: cargo-macos26-arm64-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-macos26-arm64-

      - name: Build CLI installer
        run: make pkg

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: varmint
          path: dist/varmint.pkg
          compression-level: 0
          retention-days: 7

  linux:
    needs: guest
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopus-dev libpulse-dev libsqlite3-dev libvirglrenderer-dev libx264-dev pkg-config

      - name: Download guest runtime
        uses: actions/download-artifact@v4
        with:
          name: guest-runtime-${{ matrix.arch }}
          path: build/guest

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: cargo-linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-linux-${{ matrix.arch }}-

      - name: Build CLI tarball
        run: make tarball

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: varmint-linux-${{ matrix.arch }}
          path: dist/varmint-linux-*.tar.gz
          compression-level: 0
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [app, linux]
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download CLI
        uses: actions/download-artifact@v4
        with:
          pattern: varmint*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" varmint.pkg varmint-linux-*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
