[package]
name = "vm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
libc = "0.2"
crossterm = "0.29.0"
num_enum = "0.7.6"
polyfuse-kernel = "0.2.0"
rtrb = "0.3.4"
zerocopy = { version = "0.8.50", features = ["derive"] }
rusqlite = "0.40.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
vm-fdt = "0.3.0"
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit"] }
gpui-component = "0.9.0"
gpui-kit-assets = "0.9.0"
# Frames for gpui images; gpui uses it without re-exporting it.
image = { version = "0.25", default-features = false }
# Terminal emulation for `vm ui` shells, from Ghostty; builds with the zig in mise.toml.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "macos")'.dependencies]
applevisor = "1.0"
applevisor-sys = "1.0.0"
coreaudio-rs = "0.14.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.24"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.18"
